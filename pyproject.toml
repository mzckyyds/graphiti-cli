[project]
name = "graphiti-cli"
version = "0.1.0"
description = "CLI for Graphiti"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "graphiti-core[falkordb]>=0.30.1",
    "httpx>=0.28.1",
    "typer>=0.27.2",
]

[project.scripts]
graphiti-cli = "graphiti_cli.__main__:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/graphiti_cli"]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=1.0", "ruff>=0.11", "pyright>=1.1.399"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
# 与 Black 默认值一致
line-length = 88
target-version = "py312"

[tool.ruff.lint]
# 采用全选项+单项逐一排除的模式
select = ["ALL"]
ignore = [
    # 项目暂无版权声明要求
    "CPY001",
    # 异常规范要求 f-string + !r 传消息, 与 EM101/EM102/TRY003 冲突
    "EM101",
    "EM102",
    "TRY003",
    # 与 formatter 的尾逗号处理冲突, 由 ruff format 统一保证
    "COM812",
]

[tool.ruff.lint.flake8-bugbear]
# typer 的选项声明约定是在参数默认值里调用 Option/Argument
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.ruff.lint.per-file-ignores]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
skip-magic-trailing-comma = false

[tool.pyright]
typeCheckingMode = "strict"
